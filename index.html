<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A personal options trading journal for tracking positions and performance."
    >

    <title>Options Journal</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="tic.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="wrap">

        <header>

            <div class="branding">

                <h1 class="wordmark">
                    Options <span>Journal</span>
                </h1>

                <div class="tagline">
                    Trade log &amp; performance ledger
                </div>

            </div>

            <div class="header-right">

                <div
                    class="today"
                    id="todayDate"
                ></div>

                <div
                    id="authContainer"
                    class="auth-container"
                >

                    <!-- Visible when the user is logged out -->
                    <button
                        id="loginBtn"
                        class="btn-primary"
                        type="button"
                    >
                        Sign in with GitHub
                    </button>

                    <!-- Visible when the user is logged in -->
                    <div
                        id="userInfo"
                        class="user-info"
                        hidden
                    >

                        

                        <span
                            id="userEmail"
                            class="user-display-name"
                        ></span>

                        <button
                            id="logoutBtn"
                            class="btn-ghost"
                            type="button"
                        >
                            Log out
                        </button>

                    </div>

                </div>

            </div>

        </header>

        <!--
            Used by script.js for login status, loading status,
            configuration warnings, and database errors.
        -->
        <div
            id="appMessage"
            class="app-message"
            role="status"
            aria-live="polite"
            hidden
        ></div>

        <!--
            The journal remains hidden until Supabase confirms
            that the user has authenticated.
        -->
        <main
            id="journalApp"
            hidden
        >

            <!-- Summary cards are generated by script.js -->
            <section
                class="summary"
                id="summary"
                aria-label="Trading summary"
            ></section>

            <section
                class="toolbar"
                aria-label="Journal controls"
            >

                <div class="filters">

                    <label
                        class="sr-only"
                        for="filterStatus"
                    >
                        Filter by position status
                    </label>

                    <select
                        id="filterStatus"
                        aria-label="Filter by position status"
                    >
                        <option value="all">
                            All positions
                        </option>

                        <option value="open">
                            Open
                        </option>

                        <option value="closed">
                            Closed
                        </option>
                    </select>

                    <label
                        class="sr-only"
                        for="filterType"
                    >
                        Filter by option type
                    </label>

                    <select
                        id="filterType"
                        aria-label="Filter by option type"
                    >
                        <option value="all">
                            All types
                        </option>

                        <option value="Call">
                            Calls
                        </option>

                        <option value="Put">
                            Puts
                        </option>
                    </select>

                    <label
                        class="sr-only"
                        for="filterTicker"
                    >
                        Filter by ticker
                    </label>

                    <input
                        type="text"
                        id="filterTicker"
                        placeholder="Filter by ticker..."
                        aria-label="Filter by ticker"
                        autocomplete="off"
                        maxlength="10"
                        spellcheck="false"
                    >

                </div>

                <button
                    class="btn-primary"
                    id="toggleForm"
                    type="button"
                    aria-controls="formPanel"
                    aria-expanded="false"
                >
                    + New Entry
                </button>

            </section>

            <!-- New trade form -->
            <section
                class="panel"
                id="formPanel"
                aria-labelledby="newPositionHeading"
            >

                <h2 id="newPositionHeading">
                    New Position
                </h2>

                <div class="grid-form">

                    <div class="field">

                        <label for="f_ticker">
                            Ticker
                        </label>

                        <input
                            type="text"
                            id="f_ticker"
                            placeholder="SPY"
                            autocomplete="off"
                            maxlength="10"
                            spellcheck="false"
                            required
                        >

                    </div>

                    <div class="field">

                        <label for="f_type">
                            Type
                        </label>

                        <select id="f_type">

                            <option value="Call">
                                Call
                            </option>

                            <option value="Put">
                                Put
                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label for="f_side">
                            Side
                        </label>

                        <select id="f_side">

                            <option value="Long">
                                Long
                            </option>

                            <option value="Short">
                                Short
                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label for="f_strategy">
                            Strategy
                        </label>

                        <select id="f_strategy">

                            <option value="Single Leg">
                                Single Leg
                            </option>

                            <option value="Covered Call">
                                Covered Call
                            </option>

                            <option value="Cash-Secured Put">
                                Cash-Secured Put
                            </option>

                            <option value="Vertical Spread">
                                Vertical Spread
                            </option>

                            <option value="Iron Condor">
                                Iron Condor
                            </option>

                            <option value="Straddle">
                                Straddle
                            </option>

                            <option value="Strangle">
                                Strangle
                            </option>

                            <option value="Calendar">
                                Calendar
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label for="f_strike">
                            Strike ($)
                        </label>

                        <input
                            type="number"
                            id="f_strike"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="450"
                            required
                        >

                    </div>

                    <div class="field">

                        <label for="f_exp">
                            Expiration
                        </label>

                        <input
                            type="date"
                            id="f_exp"
                        >

                    </div>

                    <div class="field">

                        <label for="f_contracts">
                            Contracts
                        </label>

                        <input
                            type="number"
                            id="f_contracts"
                            min="1"
                            step="1"
                            inputmode="numeric"
                            value="1"
                            required
                        >

                    </div>

                    <div class="field">

                        <label for="f_entryDate">
                            Entry Date
                        </label>

                        <input
                            type="date"
                            id="f_entryDate"
                        >

                    </div>

                    <div class="field">

                        <label for="f_entryPrice">
                            Entry Price ($/share)
                        </label>

                        <input
                            type="number"
                            id="f_entryPrice"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="2.35"
                            required
                        >

                    </div>

                    <div class="field">

                        <label for="f_exitPrice">
                            Exit Price (optional)
                        </label>

                        <input
                            type="number"
                            id="f_exitPrice"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="Leave blank if open"
                        >

                    </div>

                    <div class="field">

                        <label for="f_exitDate">
                            Exit Date (optional)
                        </label>

                        <input
                            type="date"
                            id="f_exitDate"
                        >

                    </div>

                    <div class="field span2">

                        <label for="f_notes">
                            Notes
                        </label>

                        <textarea
                            id="f_notes"
                            placeholder="Thesis, setup, what happened..."
                            rows="4"
                            maxlength="5000"
                        ></textarea>

                    </div>

                </div>

                <div class="panel-actions">

                    <button
                        class="btn-primary"
                        id="saveTrade"
                        type="button"
                    >
                        Log Trade
                    </button>

                    <button
                        class="btn-ghost"
                        id="cancelForm"
                        type="button"
                    >
                        Cancel
                    </button>

                </div>

            </section>

            <!-- Trade rows are generated by script.js -->
            <section
                id="ledgerContainer"
                aria-label="Options trade ledger"
            ></section>

        </main>

    </div>

    <!--
        Supabase must load before script.js.
        This exposes window.supabase for the application.
    -->
    https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>

    <!-- Application code -->
    <script src="script.js"></script>

</body>

</html>
